name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: namespace-profile-siddhant-khare
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimum supported PDF extra
        if: matrix.python-version == '3.12'
        run: python -m pip install "reportlab==4.0.4"

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  windows:
    # Exercises the msvcrt file-lock and atomic-replace paths in fileutil.py,
    # the trace store lock, and LF line endings in trace-store files, which
    # the Linux jobs never run natively. Only these tests run here: the full
    # suite does not yet pass on Windows (POSIX signals and file modes, CRLF
    # in CLI and report output, cp1252 stdout).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run lock, atomic-write and line-ending tests
        run: >-
          python -m unittest -v
          tests.test_fileutil
          tests.test_line_endings
          tests.test_telemetry
          tests.test_sso
          tests.test_rbac
          tests.test_iac
          tests.test_config_watch
          tests.test_store.TestTraceStore
          tests.test_store.TestStoreWriteLock
        env:
          PYTHONPATH: src
          # Redirected stdout defaults to cp1252, which cannot print the
          # CLI's check marks.
          PYTHONIOENCODING: utf-8

  vscode-extension:
    runs-on: namespace-profile-siddhant-khare
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and test extension
        run: npm test
