name: Publish VS Code Extension

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extension tag to publish (e.g. vscode-v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: namespace-profile-siddhant-khare
    env:
      PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLISH_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Compile and test extension
        run: npm test

      - name: Install publishing tools
        run: npm install --global @vscode/vsce@4.1.0 ovsx@1.3.0

      - name: Verify publish target
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${PUBLISH_TAG}^{commit}")"
          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          test "$VERSION" = "$LOCK_VERSION"
          test "$VERSION" = "$LOCK_ROOT_VERSION"
          test "$PUBLISH_TAG" = "vscode-v$VERSION"

      # vscode:prepublish runs `tsc` automatically before packaging.
      - name: Package extension
        run: vsce package --out agent-strace.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-strace-vsix
          path: vscode-extension/agent-strace.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --packagePath agent-strace.vsix --skip-duplicate

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: ovsx publish agent-strace.vsix --skip-duplicate
