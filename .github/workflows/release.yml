name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: namespace-profile-siddhant-khare

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Validate plugin package metadata
        run: uv run python -m unittest tests.test_plugin tests.test_claude_plugin -v

      - name: Read current version
        id: version
        run: |
          VERSION=$(grep '^__version__' src/agent_trace/__init__.py \
            | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release version parity
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          plugin = json.loads(Path("plugin.json").read_text())
          marketplace = json.loads(
              Path(".github/plugin/marketplace.json").read_text()
          )

          versions = {
              "plugin.json": plugin["version"],
              ".github/plugin/marketplace.json metadata": (
                  marketplace["metadata"]["version"]
              ),
              ".github/plugin/marketplace.json plugin": (
                  marketplace["plugins"][0]["version"]
              ),
          }
          mismatches = [
              f"{source}: expected {expected}, found {version}"
              for source, version in versions.items()
              if version != expected
          ]
          if mismatches:
              raise SystemExit(
                  "Release version parity check failed:\n- "
                  + "\n- ".join(mismatches)
              )
          PY

      - name: Build changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 \
            --exclude="${{ steps.check.outputs.tag }}" \
            --exclude="vscode-v*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" HEAD | head -20 > /tmp/changelog.txt
          else
            git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" > /tmp/changelog.txt
          fi

      - name: Build interoperability release asset
        if: steps.check.outputs.exists == 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path.cwd()
          output = root / "dist" / "agent-strace-interoperability-v1.zip"
          output.parent.mkdir(parents=True, exist_ok=True)
          sources = [
              (root / "src/agent_trace/schemas/trace/v1", Path("schemas/trace/v1")),
              (root / "src/agent_trace/corpus/v1", Path("corpus/v1")),
          ]
          documents = [
              root / "docs/trace-schema.md",
              root / "docs/agent-evidence-corpus.md",
              root / "LICENSE",
          ]
          with ZipFile(output, "w", compression=ZIP_DEFLATED) as archive:
              for source, prefix in sources:
                  for path in sorted(item for item in source.rglob("*") if item.is_file()):
                      info = ZipInfo((prefix / path.relative_to(source)).as_posix())
                      info.date_time = (1980, 1, 1, 0, 0, 0)
                      info.compress_type = ZIP_DEFLATED
                      info.external_attr = 0o644 << 16
                      archive.writestr(info, path.read_bytes())
              for path in documents:
                  info = ZipInfo(path.relative_to(root).as_posix())
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, path.read_bytes())
          PY

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/changelog.txt \
            --target "${{ github.sha }}" \
            "dist/agent-strace-interoperability-v1.zip#AgentTrace interoperability schemas and Agent Evidence Corpus"

      # Releases created with GITHUB_TOKEN don't fire `release: published`,
      # but GITHUB_TOKEN can trigger workflow_dispatch.
      - name: Dispatch PyPI publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"
