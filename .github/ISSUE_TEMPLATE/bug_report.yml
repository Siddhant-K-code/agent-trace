name: Bug report
description: Report a reproducible defect in agent-trace.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: agent-trace version
      placeholder: 0.103.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, and integration or editor.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove secrets, prompts, trace contents, and private repository data.
      render: shell
