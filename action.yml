name: agent-trace eval
description: Run agent-trace evals and a PR reviewability check in CI. Upload PR evidence artifacts, post results to the step summary or the PR, and fail on regression or a missing review signal.
author: Siddhant-K-code
branding:
  icon: activity
  color: purple

inputs:
  config:
    description: Path to eval config file
    default: .agent-evals.yaml
  baseline:
    description: Path to baseline scores file (optional)
    default: ""
  save-baseline:
    description: Path to save current scores as a new baseline (optional)
    default: ""
  tolerance:
    description: Regression tolerance (0.0–1.0, default 0.05)
    default: "0.05"
  trace-dir:
    description: Directory where agent-trace sessions are stored
    default: .agent-traces
  python-version:
    description: Python version to use
    default: "3.12"
  install-extras:
    description: Comma-separated optional extras to install (e.g. openai,anthropic)
    default: ""
  post-pr-comment:
    description: Post or update an agent session summary on the pull request
    default: "false"
  github-token:
    description: GitHub token used only when post-pr-comment is true
    default: ""
  run-eval:
    description: Run agent-strace eval. Set to false for a review-only workflow.
    default: "true"
  review:
    description: Run the reviewability check and fail the step per the threshold
    default: "false"
  review-fail-on:
    description: Statuses that fail the check (comma list or none). Empty uses the review block in .agent-strace.yaml, then missing.
    default: ""
  review-min-confidence:
    description: Lowest confidence that can fail the check (low, medium, high). Empty uses config, then medium.
    default: ""
  review-commits:
    description: Git revision range to read Entire-Checkpoint and Agent-Logs-Url trailers from, such as origin/main..HEAD. Needs the history in the checkout (fetch-depth 0). Reported, not graded.
    default: ""
  review-otel-logs:
    description: Path to a Claude Code OpenTelemetry logs export (OTLP JSON or JSON Lines) to read safety_event from. Reported, not graded.
    default: ""
  cognitive-debt:
    description: Cognitive debt report for the review session. false skips it, report adds it to the review, check also fails the check unless the result is a pass. Status unknown is never a pass.
    default: "report"

outputs:
  passed:
    description: "true if all scorers passed, false otherwise"
    value: ${{ steps.eval.outputs.passed }}
  summary-path:
    description: Path to the written eval summary markdown file
    value: ${{ steps.eval.outputs.summary-path }}
  review-passed:
    description: "true if the reviewability check passed, false if it failed, empty if it did not run"
    value: ${{ steps.review.outputs.passed }}
  review-result:
    description: "pass, fail, or error. Empty if the check did not run."
    value: ${{ steps.review.outputs.review-result }}
  review-markdown-path:
    description: Path to review.md on the runner
    value: ${{ steps.review.outputs.review-markdown-path }}
  review-json-path:
    description: Path to review.json on the runner
    value: ${{ steps.review.outputs.review-json-path }}
  evidence-packet-path:
    description: Path to the metadata-only evidence packet HTML. Empty if it was not generated.
    value: ${{ steps.evidence.outputs.evidence-packet-path }}
  cognitive-debt-json-path:
    description: Path to the schema v1 cognitive debt JSON. Empty if it was not generated.
    value: ${{ steps.evidence.outputs.cognitive-debt-json-path }}
  cognitive-debt-badge-path:
    description: Path to the Shields endpoint JSON. Empty if it was not generated.
    value: ${{ steps.evidence.outputs.cognitive-debt-badge-path }}
  cognitive-debt-status:
    description: "Cognitive debt status from the schema v1 report: clean, partial, above_threshold, unknown, or empty"
    value: ${{ steps.review.outputs.cognitive-debt-status }}
  cognitive-debt-result:
    description: "pass, fail, or unavailable. unknown status and missing reports are unavailable."
    value: ${{ steps.review.outputs.cognitive-debt-result }}
  artifacts-dir:
    description: Directory holding the PR evidence files
    value: ${{ steps.review.outputs.artifacts-dir || steps.evidence.outputs.artifacts-dir }}
  evidence-artifact-url:
    description: URL of the agent-trace-pr-evidence artifact. Empty if the upload did not happen.
    value: ${{ steps.upload-evidence.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-trace
      shell: bash
      run: |
        EXTRAS="${{ inputs.install-extras }}"
        if [ -n "$EXTRAS" ]; then
          pip install "agent-strace[$EXTRAS]"
        else
          pip install agent-strace
        fi

    - name: Run evals
      id: eval
      if: ${{ inputs.run-eval == 'true' }}
      shell: bash
      env:
        EVAL_CONFIG: ${{ inputs.config }}
        EVAL_BASELINE: ${{ inputs.baseline }}
        EVAL_SAVE_BASELINE: ${{ inputs.save-baseline }}
        EVAL_TOLERANCE: ${{ inputs.tolerance }}
        EVAL_TRACE_DIR: ${{ inputs.trace-dir }}
      run: |
        ARGS=(--config "$EVAL_CONFIG" --tolerance "$EVAL_TOLERANCE")

        if [ -n "$EVAL_BASELINE" ]; then
          ARGS+=(--baseline "$EVAL_BASELINE")
        fi

        if [ -n "$EVAL_SAVE_BASELINE" ]; then
          ARGS+=(--save-baseline "$EVAL_SAVE_BASELINE")
        fi

        if agent-strace --trace-dir "$EVAL_TRACE_DIR" eval "${ARGS[@]}"; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
          echo "summary-path=$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload trace artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-traces
        path: ${{ inputs.trace-dir }}
        if-no-files-found: ignore

    - name: Post agent-trace PR comment
      if: ${{ always() && inputs.post-pr-comment == 'true' && inputs.review != 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_COMMENT_TRACE_DIR: ${{ inputs.trace-dir }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BASE_REPOSITORY: ${{ github.repository }}
      run: |
        if [ -n "$PR_HEAD_REPOSITORY" ] && [ "$PR_HEAD_REPOSITORY" != "$PR_BASE_REPOSITORY" ]; then
          echo "::notice::Skipping PR comment for a fork because pull_request tokens are read-only."
        elif find "$PR_COMMENT_TRACE_DIR" -mindepth 2 -name meta.json -print -quit 2>/dev/null | grep -q .; then
          agent-strace --trace-dir "$PR_COMMENT_TRACE_DIR" pr-comment
        else
          echo "::notice::No agent-trace sessions found; skipping PR comment."
        fi

    - name: Prepare PR evidence
      id: evidence
      if: ${{ always() && inputs.review == 'true' }}
      shell: bash
      env:
        AGENT_TRACE_DIR: ${{ inputs.trace-dir }}
        COGNITIVE_DEBT_MODE: ${{ inputs.cognitive-debt }}
      run: bash "$GITHUB_ACTION_PATH/scripts/pr-evidence.sh" prepare

    - name: Upload PR evidence
      id: upload-evidence
      if: ${{ always() && inputs.review == 'true' && steps.evidence.outputs.artifacts-dir != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: agent-trace-pr-evidence
        path: |
          ${{ steps.evidence.outputs.evidence-packet-path }}
          ${{ steps.evidence.outputs.cognitive-debt-json-path }}
          ${{ steps.evidence.outputs.cognitive-debt-badge-path }}
        if-no-files-found: ignore

    - name: Reviewability check
      id: review
      if: ${{ always() && inputs.review == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        AGENT_TRACE_DIR: ${{ inputs.trace-dir }}
        REVIEW_FAIL_ON: ${{ inputs.review-fail-on }}
        REVIEW_MIN_CONFIDENCE: ${{ inputs.review-min-confidence }}
        REVIEW_COMMITS: ${{ inputs.review-commits }}
        REVIEW_OTEL_LOGS: ${{ inputs.review-otel-logs }}
        REVIEW_POST_COMMENT: ${{ inputs.post-pr-comment }}
        COGNITIVE_DEBT_MODE: ${{ inputs.cognitive-debt }}
        ARTIFACT_URL: ${{ steps.upload-evidence.outputs.artifact-url }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BASE_REPOSITORY: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/scripts/pr-evidence.sh" check

    - name: Upload review report
      if: ${{ always() && inputs.review == 'true' && (steps.review.outputs.review-json-path != '' || steps.review.outputs.review-markdown-path != '') }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: agent-trace-pr-review
        path: |
          ${{ steps.review.outputs.review-json-path }}
          ${{ steps.review.outputs.review-markdown-path }}
        if-no-files-found: ignore
