<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-NONCE_PLACEHOLDER';">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--vscode-font-family);
    font-size: 13px;
    color: var(--vscode-foreground);
    background: var(--vscode-sideBar-background);
    min-height: 100vh;
  }
  button, input {
    font: inherit;
  }
  button:focus-visible, input:focus-visible, .event:focus-visible {
    outline: 2px solid var(--vscode-focusBorder);
    outline-offset: 1px;
  }
  #header {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 10px;
    border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, #333);
    background: var(--vscode-sideBar-background);
  }
  #identity {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
  }
  #title {
    font-weight: 650;
    font-size: 18px;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  #capture {
    margin-top: 3px;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
    line-height: 1.4;
  }
  #health {
    flex-shrink: 0;
    border: 1px solid currentColor;
    padding: 2px 6px;
    font-size: 10px;
  }
  #health.healthy { color: var(--vscode-testing-iconPassed, #73c991); }
  #health.partial { color: var(--vscode-editorWarning-foreground, #cca700); }
  #health.invalid { color: var(--vscode-errorForeground, #f48771); }
  #health.unknown { color: var(--vscode-descriptionForeground); }
  #facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 10px;
    margin-top: 9px;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
  }
  .fact strong {
    display: block;
    color: var(--vscode-foreground);
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  #active-tool {
    margin-top: 7px;
    min-height: 13px;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
  }
  #actions, #live-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  button {
    border: 1px solid var(--vscode-button-border, transparent);
    border-radius: 2px;
    padding: 3px 7px;
    cursor: pointer;
    color: var(--vscode-button-secondaryForeground);
    background: var(--vscode-button-secondaryBackground);
    font-size: 10px;
  }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button.primary {
    color: var(--vscode-button-foreground);
    background: var(--vscode-button-background);
  }
  button.primary:hover { background: var(--vscode-button-hoverBackground); }
  button:disabled { opacity: .45; cursor: default; }
  #gap-details {
    margin-top: 8px;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
  }
  #gap-details summary {
    cursor: pointer;
    color: var(--vscode-editorWarning-foreground, #cca700);
  }
  #gap-list {
    margin: 6px 0 0 15px;
    line-height: 1.45;
  }
  #filters {
    padding: 8px 10px;
    border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, #333);
  }
  #search {
    width: 100%;
    padding: 5px 7px;
    color: var(--vscode-input-foreground);
    background: var(--vscode-input-background);
    border: 1px solid var(--vscode-input-border, transparent);
  }
  #filter-chips {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-top: 6px;
  }
  .chip {
    white-space: nowrap;
    background: transparent;
    color: var(--vscode-descriptionForeground);
    border-color: var(--vscode-sideBarSectionHeader-border, #444);
  }
  .chip.active {
    color: var(--vscode-button-foreground);
    background: var(--vscode-button-background);
  }
  #count {
    padding: 6px 10px;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
  }
  #comparison {
    display: none;
    margin: 0 10px 8px;
    padding: 9px;
    border: 1px solid var(--vscode-focusBorder);
    background: var(--vscode-textBlockQuote-background);
    font-size: 10px;
  }
  #comparison.visible { display: block; }
  #capture-doctor {
    display: none;
    margin: 0 10px 8px;
    padding: 8px;
    max-height: 180px;
    overflow: auto;
    border: 1px solid var(--vscode-sideBarSectionHeader-border, #444);
    color: var(--vscode-descriptionForeground);
    background: var(--vscode-textCodeBlock-background);
    font-family: var(--vscode-editor-font-family);
    font-size: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #capture-doctor.visible { display: block; }
  #capture-doctor.ok { border-color: var(--vscode-testing-iconPassed, #73c991); }
  #capture-doctor.failed { border-color: var(--vscode-errorForeground, #f48771); }
  #comparison h3 { font-size: 13px; margin-bottom: 5px; }
  .compare-verdict { color: var(--vscode-charts-blue); margin-bottom: 6px; }
  .compare-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 1px;
    background: var(--vscode-sideBarSectionHeader-border, #444);
  }
  .compare-grid span {
    padding: 4px;
    background: var(--vscode-sideBar-background);
  }
  #events {
    position: relative;
    padding: 0 8px 16px;
  }
  #events::before {
    content: "";
    position: absolute;
    left: 22px;
    top: 12px;
    bottom: 22px;
    width: 1px;
    background: var(--vscode-sideBarSectionHeader-border, #444);
  }
  .event {
    position: relative;
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    margin-bottom: 6px;
    border: 1px solid var(--vscode-sideBarSectionHeader-border, #444);
    background: var(--vscode-editor-background);
  }
  .event.selected {
    border-color: var(--vscode-focusBorder);
    box-shadow: 0 0 0 1px var(--vscode-focusBorder);
  }
  .event.gap {
    border-color: var(--vscode-editorWarning-foreground, #cca700);
    background: var(--vscode-inputValidation-warningBackground, var(--vscode-editor-background));
  }
  .sequence {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding-top: 8px;
  }
  .sequence span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 1px solid var(--vscode-sideBarSectionHeader-border, #555);
    background: var(--vscode-editor-background);
    color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family);
    font-size: 10px;
  }
  .content { min-width: 0; padding: 7px 8px 8px 0; }
  .event-head {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .event-type { font-weight: 600; font-size: 13px; }
  .time {
    color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family);
    font-size: 13px;
    white-space: nowrap;
  }
  .summary {
    margin-top: 4px;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
    line-height: 1.4;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .categories, .relations {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 5px;
  }
  .category {
    padding: 1px 4px;
    border: 1px solid var(--vscode-sideBarSectionHeader-border, #555);
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
  }
  .category.gaps, .unresolved { color: var(--vscode-editorWarning-foreground, #cca700); }
  .relation {
    padding: 0;
    border: 0;
    color: var(--vscode-textLink-foreground);
    background: transparent;
    font-size: 10px;
  }
  .annotation {
    margin-top: 6px;
    padding: 6px;
    border-left: 2px solid var(--vscode-charts-purple, #b180d7);
    background: var(--vscode-textBlockQuote-background);
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
    line-height: 1.4;
  }
  .annotation.correction { border-left-color: var(--vscode-editorWarning-foreground, #cca700); }
  .annotation-meta { margin-bottom: 2px; color: var(--vscode-foreground); }
  details.raw { margin-top: 6px; }
  details.raw summary {
    cursor: pointer;
    color: var(--vscode-descriptionForeground);
    font-size: 10px;
  }
  details.raw pre {
    margin-top: 5px;
    padding: 6px;
    max-height: 180px;
    overflow: auto;
    color: var(--vscode-editor-foreground);
    background: var(--vscode-textCodeBlock-background);
    font-family: var(--vscode-editor-font-family);
    font-size: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #empty, #error {
    padding: 22px 10px;
    text-align: center;
    color: var(--vscode-descriptionForeground);
    font-size: 13px;
    line-height: 1.5;
  }
  #error { display: none; color: var(--vscode-errorForeground); }
  #ended-banner {
    display: none;
    padding: 4px 10px;
    text-align: center;
    color: var(--vscode-descriptionForeground);
    background: var(--vscode-diffEditor-removedLineBackground, #3a1a1a);
    font-size: 10px;
  }
</style>
</head>
<body>
<section id="header">
  <div id="identity">
    <div>
      <div id="title">No session selected</div>
      <div id="capture">Open a recorded session from Agent Trace Sessions.</div>
    </div>
    <span id="health" class="unknown">unknown</span>
  </div>
  <div id="facts">
    <span class="fact">Start<strong id="fact-start">Not recorded</strong></span>
    <span class="fact">End<strong id="fact-end">Not recorded</strong></span>
    <span class="fact">Duration<strong id="fact-duration">Not recorded</strong></span>
    <span class="fact">Privacy<strong id="fact-privacy">Not recorded</strong></span>
  </div>
  <div id="active-tool"></div>
  <div id="actions">
    <button id="compare">Compare</button>
    <button id="share">Save minimized share</button>
    <button id="otlp">Export OTLP JSON</button>
    <button id="verify-capture" style="display:none">Verify live capture</button>
  </div>
  <div id="live-controls">
    <button class="primary" id="pause" disabled>Pause</button>
    <button id="resume" style="display:none">Resume</button>
    <button id="reset">Reset view</button>
  </div>
  <details id="gap-details">
    <summary id="gap-summary">Capture gaps and limits (0)</summary>
    <ul id="gap-list"></ul>
  </details>
</section>
<div id="ended-banner">Session ended</div>
<pre id="capture-doctor"></pre>
<section id="filters">
  <input id="search" type="search" placeholder="Search recorded fields">
  <div id="filter-chips"></div>
</section>
<div id="comparison"></div>
<div id="count"></div>
<div id="events"></div>
<div id="empty">No evidence to display.</div>
<div id="error"></div>

<script nonce="NONCE_PLACEHOLDER">
  const vscodeApi = acquireVsCodeApi();
  const saved = vscodeApi.getState() || {};
  const state = {
    review: null,
    filter: saved.filter || 'all',
    search: saved.search || '',
    selectedEventId: saved.selectedEventId || null,
    visible: [],
    selected: -1,
  };
  const labels = {
    all: 'All', files: 'Files', commands: 'Commands', tools: 'Tools',
    tests: 'Tests', failures: 'Failures', retry: 'Retries', recovery: 'Recovery',
    annotations: 'Annotations', corrections: 'Corrections', privacy: 'Privacy',
    gaps: 'Gaps',
  };
  const eventsEl = document.getElementById('events');
  const searchEl = document.getElementById('search');
  const emptyEl = document.getElementById('empty');
  const errorEl = document.getElementById('error');
  const pauseBtn = document.getElementById('pause');
  const resumeBtn = document.getElementById('resume');
  searchEl.value = state.search;

  function persist() {
    vscodeApi.setState({
      filter: state.filter,
      search: state.search,
      selectedEventId: state.selectedEventId,
    });
  }
  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined && text !== null) element.textContent = String(text);
    return element;
  }
  function formatDate(timestamp) {
    return timestamp ? new Date(timestamp * 1000).toLocaleString() : 'Not recorded';
  }
  function formatTime(timestamp) {
    return timestamp ? new Date(timestamp * 1000).toISOString().slice(11, 23) : '';
  }
  function formatDuration(milliseconds) {
    if (milliseconds === null || milliseconds === undefined) return 'In progress';
    if (milliseconds < 1000) return Math.round(milliseconds) + ' ms';
    if (milliseconds < 60000) return (milliseconds / 1000).toFixed(1) + ' s';
    return Math.floor(milliseconds / 60000) + ' m ' + Math.round((milliseconds % 60000) / 1000) + ' s';
  }
  function renderHeader(review, controls) {
    const session = review.session;
    document.getElementById('title').textContent = 'Session ' + session.session_id;
    document.getElementById('capture').textContent =
      session.provider + ' | ' + session.capture_method +
      (session.agent_name ? ' | ' + session.agent_name : '');
    const health = document.getElementById('health');
    health.className = review.evidence_health.status || 'unknown';
    health.textContent = review.evidence_health.status || 'unknown';
    document.getElementById('fact-start').textContent = formatDate(session.started_at);
    document.getElementById('fact-end').textContent = formatDate(session.ended_at);
    document.getElementById('fact-duration').textContent = formatDuration(session.duration_ms);
    document.getElementById('fact-privacy').textContent =
      review.privacy.redaction_mode.replaceAll('_', ' ') + ' | ' +
      review.privacy.content_mode.replaceAll('_', ' ');
    document.getElementById('active-tool').textContent = controls && controls.activeTool
      ? 'Active tool: ' + controls.activeTool + (controls.cost ? ' | $' + controls.cost : '')
      : controls && controls.cost ? 'Estimated cost: $' + controls.cost : '';
    document.getElementById('verify-capture').style.display =
      session.provider === 'claude' || session.provider === 'codex' ? '' : 'none';
    pauseBtn.disabled = !(controls && controls.live);
    pauseBtn.style.display = controls && controls.paused ? 'none' : '';
    resumeBtn.style.display = controls && controls.paused ? '' : 'none';
    const gaps = review.capture_gaps || [];
    const unresolvedAnnotations = [...(review.unresolved_annotations || [])];
    document.getElementById('gap-summary').textContent =
      'Capture gaps and limits (' + gaps.length + ')';
    const gapList = document.getElementById('gap-list');
    gapList.replaceChildren();
    if (!gaps.length) {
      gapList.appendChild(node('li', '', 'No observed structural gaps or declared provider limits.'));
    } else {
      gaps.forEach((gap) => {
        let text = gap.code + ': ' + gap.message;
        if (gap.code === 'unresolved_annotation' && unresolvedAnnotations.length) {
          const annotation = unresolvedAnnotations.shift();
          text += ' Annotation: ' +
            (annotation.note || annotation.label || annotation.annotation_id);
        }
        gapList.appendChild(node('li', '', text));
      });
    }
  }
  function renderFilters(review) {
    const chips = document.getElementById('filter-chips');
    chips.replaceChildren();
    const entries = [{ id: 'all', count: review.items.length }, ...review.filters];
    entries.forEach((entry) => {
      const button = node(
        'button',
        'chip' + (state.filter === entry.id ? ' active' : ''),
        (labels[entry.id] || entry.id) + ' ' + entry.count,
      );
      button.type = 'button';
      button.addEventListener('click', () => {
        state.filter = entry.id;
        persist();
        renderFilters(review);
        renderEvidence();
      });
      chips.appendChild(button);
    });
  }
  function relationButton(label, eventId) {
    const button = node('button', 'relation', label + ' ' + eventId);
    button.type = 'button';
    button.addEventListener('click', () => selectEvent(eventId, true));
    return button;
  }
  function renderItem(item) {
    const card = node('article', 'event' + (item.categories.includes('gaps') ? ' gap' : ''));
    card.tabIndex = -1;
    card.dataset.eventId = item.event_id;
    const sequence = node('div', 'sequence');
    sequence.appendChild(node('span', '', item.sequence));
    const content = node('div', 'content');
    const head = node('div', 'event-head');
    head.append(
      node('span', 'event-type', item.event_type.replaceAll('_', ' ')),
      node('span', 'time', formatTime(item.timestamp)),
    );
    content.append(head, node('div', 'summary', item.summary));
    const categories = node('div', 'categories');
    item.categories.forEach((category) => categories.appendChild(
      node('span', 'category ' + category, labels[category] || category),
    ));
    content.appendChild(categories);
    const relations = node('div', 'relations');
    if (item.parent_id) {
      if (item.relationship === 'linked') {
        relations.appendChild(relationButton('Parent', item.parent_id));
      } else {
        relations.appendChild(node(
          'span',
          'unresolved',
          'Unresolved parent ' + item.parent_id + ' (' + (item.relationship_issue || 'unknown') + ')',
        ));
      }
    } else if (item.relationship_issue === 'missing_parent') {
      relations.appendChild(node('span', 'unresolved', 'Missing parent relationship'));
    }
    item.child_ids.forEach((childId) => relations.appendChild(relationButton('Child', childId)));
    if (item.missing_child) {
      relations.appendChild(node('span', 'unresolved', 'Missing terminal result'));
    }
    if (relations.childNodes.length) content.appendChild(relations);
    item.annotations.forEach((annotation) => {
      const box = node('div', 'annotation' + (annotation.correction ? ' correction' : ''));
      box.append(
        node(
          'div',
          'annotation-meta',
          [annotation.label, annotation.author].filter(Boolean).join(' | ') || 'Annotation',
        ),
        node('div', '', annotation.note || 'No note recorded'),
      );
      content.appendChild(box);
    });
    const details = node('details', 'raw');
    details.append(node('summary', '', 'Source ' + item.event_id + ' | raw provider fields'));
    const pre = node('pre');
    pre.textContent = JSON.stringify(item.data, null, 2);
    details.appendChild(pre);
    content.appendChild(details);
    card.append(sequence, content);
    card.addEventListener('click', (event) => {
      if (
        event.target instanceof HTMLButtonElement ||
        (event.target instanceof HTMLElement && event.target.closest('details'))
      ) return;
      selectEvent(item.event_id, false);
    });
    return card;
  }
  function renderEvidence() {
    if (!state.review) return;
    const query = state.search.trim().toLowerCase();
    state.visible = state.review.items.filter((item) => {
      if (state.filter !== 'all' && !item.categories.includes(state.filter)) return false;
      if (!query) return true;
      return [item.event_id, item.event_type, item.summary, JSON.stringify(item.data)]
        .some((value) => String(value).toLowerCase().includes(query));
    });
    eventsEl.replaceChildren(...state.visible.map(renderItem));
    document.getElementById('count').textContent =
      state.visible.length + ' of ' + state.review.items.length + ' evidence items';
    emptyEl.style.display = state.visible.length ? 'none' : '';
    state.selected = -1;
    if (state.selectedEventId) selectEvent(state.selectedEventId, false);
  }
  function selectEvent(eventId, scroll) {
    const index = state.visible.findIndex((item) => item.event_id === eventId);
    if (index < 0 && state.review) {
      const exists = state.review.items.some((item) => item.event_id === eventId);
      if (exists) {
        state.filter = 'all';
        state.search = '';
        searchEl.value = '';
        renderFilters(state.review);
        renderEvidence();
        return selectEvent(eventId, scroll);
      }
      return;
    }
    document.querySelectorAll('.event.selected').forEach((element) => {
      element.classList.remove('selected');
    });
    state.selected = index;
    state.selectedEventId = eventId;
    persist();
    const card = [...eventsEl.children].find((element) => element.dataset.eventId === eventId);
    if (card) {
      card.classList.add('selected');
      card.focus({ preventScroll: !scroll });
      if (scroll) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
  function moveSelection(delta) {
    if (!state.visible.length) return;
    const next = state.selected < 0
      ? (delta > 0 ? 0 : state.visible.length - 1)
      : Math.max(0, Math.min(state.visible.length - 1, state.selected + delta));
    selectEvent(state.visible[next].event_id, true);
  }
  function renderComparison(report) {
    const panel = document.getElementById('comparison');
    panel.replaceChildren();
    panel.classList.add('visible');
    panel.append(
      node('h3', '', report.label_a + ' compared with ' + report.label_b),
      node('div', 'compare-verdict', report.verdict),
    );
    const grid = node('div', 'compare-grid');
    [
      ['Metric', report.label_a, report.label_b],
      ['Duration', formatDuration(report.duration_a * 1000), formatDuration(report.duration_b * 1000)],
      ['Cost', '$' + report.cost_a.toFixed(4), '$' + report.cost_b.toFixed(4)],
      ['Tool calls', report.tool_calls_a, report.tool_calls_b],
      ['Files modified', report.files_modified_a, report.files_modified_b],
      ['Errors', report.errors_a, report.errors_b],
    ].flat().forEach((value) => grid.appendChild(node('span', '', value)));
    panel.appendChild(grid);
  }

  document.getElementById('compare').addEventListener('click', () => {
    vscodeApi.postMessage({ command: 'compare' });
  });
  document.getElementById('share').addEventListener('click', () => {
    vscodeApi.postMessage({ command: 'saveMinimizedShare' });
  });
  document.getElementById('otlp').addEventListener('click', () => {
    vscodeApi.postMessage({ command: 'exportOtlp' });
  });
  document.getElementById('verify-capture').addEventListener('click', () => {
    vscodeApi.postMessage({ command: 'verifyLiveCapture' });
  });
  pauseBtn.addEventListener('click', () => vscodeApi.postMessage({ command: 'pause' }));
  resumeBtn.addEventListener('click', () => vscodeApi.postMessage({ command: 'resume' }));
  document.getElementById('reset').addEventListener('click', () => {
    state.filter = 'all';
    state.search = '';
    state.selectedEventId = null;
    searchEl.value = '';
    persist();
    if (state.review) {
      renderFilters(state.review);
      renderEvidence();
    }
  });
  searchEl.addEventListener('input', () => {
    state.search = searchEl.value;
    persist();
    renderEvidence();
  });
  document.addEventListener('keydown', (event) => {
    const typing = event.target instanceof HTMLInputElement;
    if (!typing && (event.key === 'j' || event.key === 'ArrowDown')) {
      event.preventDefault();
      moveSelection(1);
    } else if (!typing && (event.key === 'k' || event.key === 'ArrowUp')) {
      event.preventDefault();
      moveSelection(-1);
    } else if (!typing && event.key === '/') {
      event.preventDefault();
      searchEl.focus();
    } else if (event.key === 'Escape') {
      state.search = '';
      searchEl.value = '';
      persist();
      renderEvidence();
      searchEl.blur();
    } else if (!typing && event.key === 'Enter' && state.selected >= 0) {
      const card = eventsEl.children[state.selected];
      const details = card && card.querySelector('details');
      if (details) details.open = !details.open;
    }
  });
  window.addEventListener('message', (event) => {
    const message = event.data;
    if (message.type === 'reset') {
      document.getElementById('ended-banner').style.display = 'none';
      return;
    }
    if (message.type === 'sessionEnd') {
      document.getElementById('ended-banner').style.display = '';
      return;
    }
    if (message.type === 'review') {
      state.review = message.model;
      errorEl.style.display = 'none';
      renderHeader(message.model, message.controls);
      renderFilters(message.model);
      renderEvidence();
      return;
    }
    if (message.type === 'comparison') {
      renderComparison(message.report);
      return;
    }
    if (message.type === 'liveCapture') {
      const output = document.getElementById('capture-doctor');
      output.className = 'visible ' + (message.result.ok ? 'ok' : 'failed');
      output.textContent = message.result.output || 'No verifier output was returned.';
      return;
    }
    if (message.type === 'error') {
      errorEl.textContent = message.message;
      errorEl.style.display = '';
    }
  });
</script>
</body>
</html>
